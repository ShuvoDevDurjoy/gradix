[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradix"
version = "0.1.0"
description = "A lightweight NumPy-based automatic differentiation and deep learning library"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.24",
	"graphviz>=0.20",
	"matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12"]
all = ["cupy-cuda12x>=12", "graphviz>=0.20", "matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gradix*"]
